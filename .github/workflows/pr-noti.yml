name: 👩‍💻👨‍💻 PR Review Noti

on:
  pull_request:
    types:
      - opened
    branches:
      - "dev"
      - "release"
      - "main"

jobs:
  analyze:
    # TODO: 워크플로우 작동 조건 조정 필요 혹은 브랜치명이 다를 경우 변경
    # 현재는 dev 브랜치로 머지 하려는 경우 또는 release/main 브랜치로 hotfix 브랜치를 머지 시에만 작동
    if: github.base_ref == 'dev' || ((github.base_ref == 'release' || github.base_ref == 'main') && startsWith(github.head_ref, 'hotfix/'))
    name: Analyze PR scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      isLarge: ${{ steps.blocks.outputs.isLarge }}
      severity: ${{ steps.blocks.outputs.severity }}
      reasons: ${{ steps.blocks.outputs.reasons }}
      files: ${{ steps.gather.outputs.files }}
      additions: ${{ steps.gather.outputs.additions }}
      deletions: ${{ steps.gather.outputs.deletions }}
      topdirs: ${{ steps.gather.outputs.topdirs }}
      reviewers: ${{ steps.gather.outputs.reviewers }}
      customCoreChanged: ${{ steps.blocks.outputs.customCoreChanged }}
      customCoreDirs: ${{ steps.blocks.outputs.customCoreDirs }}
      blocks: ${{ steps.blocks.outputs.blocks }}
    steps:
      - name: Gather PR file stats
        id: gather
        env:
          CODE_REVIEWERS: ${{ vars.CODE_REVIEWERS }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            let page=1, per_page=100, files=[];
            while(true){
              const res = await github.rest.pulls.listFiles({ owner, repo, pull_number: pr.number, page, per_page });
              files = files.concat(res.data);
              if(res.data.length < per_page) break;
              page++;
            }
            const additions = files.reduce((a,f)=>a+f.additions,0);
            const deletions = files.reduce((a,f)=>a+f.deletions,0);
            const filenames = files.map(f=>f.filename);
            const topdirs = Object.entries(
              filenames.reduce((acc, fn) => {
                const d = fn.split('/')[0] || '(root)';
                acc[d] = (acc[d] || 0) + 1; return acc;
              }, {})
            ).sort((a,b)=>b[1]-a[1]).slice(0,5)
             .map(([d,c])=>`${d}(${c})`).join(', ');

            const reviewers = process.env.CODE_REVIEWERS;
                              
            core.setOutput('files', String(files.length));
            core.setOutput('additions', String(additions));
            core.setOutput('deletions', String(deletions));
            core.setOutput('topdirs', topdirs || '(none)');
            core.setOutput('reviewers', reviewers || 'n/a');

      - name: Build Slack blocks + evaluate scope + detect CoreDirectory change
        id: blocks
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const base = pr.base.ref;
            const head = pr.head.ref;
            const files     = Number('${{ steps.gather.outputs.files }}');
            const additions = Number('${{ steps.gather.outputs.additions }}');
            const deletions = Number('${{ steps.gather.outputs.deletions }}');
            const topdirs   = '${{ steps.gather.outputs.topdirs }}';
            const reviewers = '${{ steps.gather.outputs.reviewers }}';
            let page=1, per_page=100, allFiles=[];
            while(true){
              const res = await github.rest.pulls.listFiles({ owner, repo, pull_number: pr.number, page, per_page });
              allFiles = allFiles.concat(res.data);
              if(res.data.length < per_page) break;
              page++;
            }
            const filenames = allFiles.map(f=>f.filename);

            // 심각도 판단 기준 설정 (파일수, 라인수, 디렉토리, 라벨 등)
            // TODO: 파일 수 기준 조정 필요 시 변경
            const BIG_FILES = files > 25;

            // TODO: 라인 수 기준 조정 필요 시 변경
            const BIG_LINES = additions > 800;

            // TODO: 핵심 디렉터리 경로 조정 필요 시 변경
            // 각 항목의 규칙 및 예시:
            // 1) 끝이 '/' : 해당 디렉토리 바로 아래 1단계 하위 파일만 체크
            //    예) 'src/' → src/a.js 포함, src/subdir/b.js 제외
            // 2) 끝이 '/*' : 해당 디렉토리 하위 전체 파일 체크 (재귀 포함)
            //    예) 'src/*' → src/a.js, src/subdir/b.js 모두 포함
            // 3) '*접미사' : 파일명 끝부분과 비교
            //    예) '*.sql' → migration.sql, init.sql 포함
            // 4) 그 외 문자열 : 파일명 포함 여부 체크
            //    예) 'Dockerfile' → 루트에 Dockerfile 파일만 포함
            const touchDirs = [
              'src/',
              '*.sql',
              '.github/workflows/',
              'Dockerfile' 
              'src/testApp/*'
            ]
              
            // TODO: 백엔드, 프론트엔드, 앱 등 각 영역에 맞게 특별히 주의 및 언급이 필요한 파일/디렉토리를 조정하세요.
            const customCoreDirs = [
              'package.json',
              'src/router/'
            ]

            const TOUCH_CORE = filenames.some(fn => {
              return touchDirs.some(pattern => {
                // 하위 전체 패턴 (끝이 '/*')
                if (pattern.length >= 2 && pattern.endsWith('/*')) {
                  const base = pattern.substring(0, pattern.length - 2);
                  const result = fn.startsWith(base + '/');
                  return result;
                }

                // 바로 아래 1단계 패턴 (끝이 '/')
                if (pattern.length >= 1 && pattern.endsWith('/')) {
                  const base = pattern.substring(0, pattern.length - 1);
                  if (fn.startsWith(base + '/')) {
                    const rest = fn.substring(base.length + 1);
                    const result = rest.indexOf('/') === -1;
                    return result;
                  }
                  return false;
                }

                // 접미사 패턴 (*.sql)
                if (pattern.length >= 1 && pattern[0] === '*') {
                  const result = fn.toLowerCase().endsWith(pattern.substring(1));
                  return result;
                }

                // 단순 포함
                const result = fn.includes(pattern);
                return result;
              });
            });

            const HAS_LABEL = (pr.labels || []).some(l => ['needs-review','risk:high','breaking'].includes(l.name));
            const isLarge = BIG_FILES || BIG_LINES || TOUCH_CORE || HAS_LABEL;
            let severity='LOW', score=0;
            if (BIG_FILES) score+=2;
            if (BIG_LINES) score+=2;
            if (TOUCH_CORE) score+=2;
            if (HAS_LABEL) score+=1;
            if (score >= 5) severity='HIGH';
            else if (score >= 3) severity='MEDIUM';
            const customCoreChanged = filenames.some(fn =>
              customCoreDirs.some(dir => fn.toLowerCase().endsWith(dir) || fn.startsWith(dir))
            );
            const reasons = [
              BIG_FILES ? `변경 파일 ${files}건` : null,
              BIG_LINES ? `추가 라인 ${additions} (삭제 ${deletions})` : null,
              TOUCH_CORE ? `핵심 디렉토리 영향` : null,
              HAS_LABEL ? `주요 라벨 포함` : null,
            ].filter(Boolean).join(', ');

            const severityEmoji = { HIGH: '🔴', MEDIUM: '🟡', LOW: '🟢' }[severity];

            const header = {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": `🚀 새로운 Pull Request가 도착했습니다!`,
                "emoji": true
              }
            };

            const prInfo = {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": `*<${pr.html_url}|#${pr.number} ${pr.title}>*\n*${base}* ← *${head}* by \`${pr.user.login}\``
              }
            };

            const contextBlock = {
              "type": "context",
              "elements": [
                {
                  "type": "mrkdwn",
                  "text": `${severityEmoji} 범위판단: *${severity}*\n사유: ${reasons || 'n/a'}`
                }
              ]
            };

            const fields = [
              { "type": "mrkdwn", "text": `*변경 파일*\n${files}개` },
              { "type": "mrkdwn", "text": `*추가/삭제*\n+${additions} / -${deletions}` },
              { "type": "mrkdwn", "text": `*Top 디렉토리*\n${topdirs}` },
              { "type": "mrkdwn", "text": `*요청 리뷰어*\n${reviewers || 'n/a'}` }
            ];

            if (customCoreChanged) {
              fields.push({ "type": "mrkdwn", "text": `*핵심 디렉터리 변경*\n:warning: 감지됨` });
            }

            const mainContent = { "type": "section", "fields": fields };
            const divider = { "type": "divider" };

            const blocks = [header, prInfo, contextBlock, divider, mainContent];

            core.setOutput('blocks', JSON.stringify(blocks));
            core.setOutput('isLarge', String(isLarge));
            core.setOutput('severity', severity);
            core.setOutput('reasons', reasons || 'n/a');
            core.setOutput('customCoreChanged', String(customCoreChanged));
            core.setOutput('customCoreDirs', JSON.stringify(customCoreDirs));

  send-coderabbit-summary:
    name: "Wait for CodeRabbit and Find Summary"
    runs-on: ubuntu-latest
    needs: [analyze]
    if: github.event.pull_request.draft == false
    outputs:
      summary: ${{ steps.find_comment.outputs.summary }}
    steps:
      - name: "Wait for CodeRabbit review"
        run: sleep 180

      - name: "Find CodeRabbit summary comment"
        id: find_comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { owner, repo } = context.repo;
            const summaryIdentifier = '## Summary by CodeRabbit';

            const { data: latestPr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const prBody = latestPr.body ?? '';
            const endMarker = '<!--';

            if (prBody.includes(summaryIdentifier)) {
              let summaryContent = prBody.split(summaryIdentifier)[1]?.trim() ?? '';

              if (summaryContent) {
                if (summaryContent.includes(endMarker)) {
                  summaryContent = summaryContent.split(endMarker)[0];
                }
                core.setOutput('summary', summaryContent);  
              } else {
                core.setOutput('summary', '');
              }
            } else {
              console.log('CodeRabbit summary not found in PR body');
              core.setOutput('summary','');
            }

  notify-slack-detailed:
    name: Notify Slack with Detailed PR Info & CodeRabbit Summary
    runs-on: ubuntu-latest
    needs: [analyze, send-coderabbit-summary]
    if: github.event.pull_request.draft == false
    steps:
      - name: Generate Final Slack Payload
        id: generate_payload
        uses: actions/github-script@v7
        env:
          BLOCKS: ${{ needs.analyze.outputs.blocks }}
          SUMMARY: ${{ needs.send-coderabbit-summary.outputs.summary }}
          SEVERITY: ${{ needs.analyze.outputs.severity }}
        with:
          script: |
            let existingBlocks = JSON.parse(process.env.BLOCKS);
            const codeRabbitSummary = process.env.SUMMARY;
            const severity = process.env.SEVERITY;

            if (codeRabbitSummary && codeRabbitSummary.length > 0) {
              const lines = codeRabbitSummary
                .replace(/<!--[\s\S]*?-->/g, '') // 주석 제거
                .split('\n')
                .map(l => l.trimEnd())           // 오른쪽 공백 제거
                .filter(l => l.length > 0);     // 빈 줄 제거

              const formattedLines = [
                '🤖 CodeRabbit AI 요약\n',
                ...lines
              ];

              const cleanedSummary = formattedLines.join('\n');

              existingBlocks.push({ type: "divider" });
              existingBlocks.push({
                type: "rich_text",
                elements: [
                  {
                    type: "rich_text_preformatted",
                    elements: [
                      { type: "text", text: cleanedSummary }
                    ]
                  }
                ]
              });
            }

            existingBlocks.push({ type: "divider" });
            existingBlocks.push({
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "👉 *이 코멘트에 이모지(예: 👀, ✅)를 달아주시면 우선순위로 리뷰를 시작합니다.*"
              }
            });

            core.setOutput('final_blocks_json', JSON.stringify(existingBlocks));
            core.setOutput(
              'final_text_fallback',
              `PR #${context.issue.number} - ${context.payload.pull_request.title} (${severity})`
            );
      - name: Post to Slack
        uses: slackapi/slack-github-action@v1.25.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "${{ secrets.SLACK_CHANNEL_ID }}"
          payload: |
            {
              "text": "${{ steps.generate_payload.outputs.final_text_fallback }}",
              "blocks": ${{ steps.generate_payload.outputs.final_blocks_json }}
            }

  comment-and-label:
    name: Comment on PR (HIGH) + Auto label
    runs-on: ubuntu-latest
    needs: [analyze]
    permissions:
      pull-requests: write
      issues: write
    if: always()
    steps:
      - name: Ensure label "needs-review" exists on PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const targetLabel = 'needs-review';
            const existing = pr.labels?.map(l => l.name) || [];
            if (!existing.includes(targetLabel)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [targetLabel]
              });
              core.info(`Label "${targetLabel}" added.`);
            } else {
              core.info(`Label "${targetLabel}" already present.`);
            }

      - name: Comment on PR (dedup with marker)
        uses: actions/github-script@v7
        env:
          files: ${{ needs.analyze.outputs.files }}
          adds: ${{ needs.analyze.outputs.additions }}
          dels: ${{ needs.analyze.outputs.deletions }}
          reasons: ${{ needs.analyze.outputs.reasons }}
          customCoreChanged: ${{ needs.analyze.outputs.customCoreChanged }}
          customCoreDirs: ${{ needs.analyze.outputs.customCoreDirs }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const MARKER = '<!-- large-pr-comment -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            if (comments.some(c => (c.body || '').includes(MARKER))) {
              core.info('Existing large PR comment found. Skipping duplicate.');
              return;
            }
            const files = process.env.files;
            const adds = process.env.adds;
            const dels = process.env.dels;
            const reasons = process.env.reasons;
            const customCoreChanged = process.env.customCoreChanged === true;
            const customCoreDirs = JSON.parse(process.env.customCoreDirs || '[]');
            const customCoreLine = customCoreChanged
              ? `\n> ⚠️ \`${customCoreDirs.join('`, `')}\` 변경 감지: **핵심 디렉터리 변경점**이 있을 수 있어요.\n`
              : '';

            const body = `
            ${MARKER}
            ### 📌 PR 변경 사항 검토 안내
            - PR: #${pr.number} — **${pr.title}**
            - 범위 판단: **HIGH**
            - 사유: ${reasons}
            **변경 요약**
            - 변경 파일: ${files}개
            - 라인 변화: +${adds} / -${dels}
            ${customCoreLine}

            // TODO: 체크리스트 변경 필요 시 항목 수정
            **리뷰 체크리스트 (가이드)**
            - [ ] 핵심 비즈니스 로직 및 기능 변경 사항 검토
            - [ ] DB/마이그레이션 영향 점검 (롤백 가능성 포함)
            - [ ] 신규 의존성, 라이브러리, 환경 설정 변경 확인
            - [ ] 예외 처리, 성능, 보안, 로그 레벨 점검
            - [ ] 문서/README/워크플로우 변경 사항 확인
            - [ ] 불필요한 파일/설정 변경, 대용량 diff 검토
            `;
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body
            });
