name: 👩‍💻👨‍💻 PR Review Noti

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        ready_for_review,
        review_requested,
        synchronize,
        labeled,
      ]

jobs:
  analyze:
    name: Analyze PR scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      isLarge: ${{ steps.blocks.outputs.isLarge }}
      severity: ${{ steps.blocks.outputs.severity }}
      reasons: ${{ steps.blocks.outputs.reasons }}
      files: ${{ steps.gather.outputs.files }}
      additions: ${{ steps.gather.outputs.additions }}
      deletions: ${{ steps.gather.outputs.deletions }}
      topdirs: ${{ steps.gather.outputs.topdirs }}
      reviewers: ${{ steps.gather.outputs.reviewers }}
      dbChanged: ${{ steps.blocks.outputs.dbChanged }}
      blocks: ${{ steps.blocks.outputs.blocks }}
      mentions: ${{ steps.mentions.outputs.mentions }}
    steps:
      - name: Gather PR file stats
        id: gather
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            let page=1, per_page=100, files=[];
            while(true){
              const res = await github.rest.pulls.listFiles({ owner, repo, pull_number: pr.number, page, per_page });
              files = files.concat(res.data);
              if(res.data.length < per_page) break;
              page++;
            }

            const additions = files.reduce((a,f)=>a+f.additions,0);
            const deletions = files.reduce((a,f)=>a+f.deletions,0);
            const filenames = files.map(f=>f.filename);

            const topdirs = Object.entries(
              filenames.reduce((acc, fn) => {
                const d = fn.split('/')[0] || '(root)';
                acc[d] = (acc[d] || 0) + 1; return acc;
              }, {})
            ).sort((a,b)=>b[1]-a[1]).slice(0,5)
             .map(([d,c])=>`${d}(${c})`).join(', ');

            const reviewers = (context.payload.requested_reviewers || []).map(u=>u.login)
                              .concat((context.payload.requested_teams || []).map(t=>`team:${t.slug}`))
                              .join(',');

            core.setOutput('files', String(files.length));
            core.setOutput('additions', String(additions));
            core.setOutput('deletions', String(deletions));
            core.setOutput('topdirs', topdirs || '(none)');
            core.setOutput('reviewers', reviewers || 'n/a');

      - name: Build Slack blocks + evaluate scope + detect DB change
        id: blocks
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const base = pr.base.ref;
            const head = pr.head.ref;

            const files     = Number('${{ steps.gather.outputs.files }}');
            const additions = Number('${{ steps.gather.outputs.additions }}');
            const deletions = Number('${{ steps.gather.outputs.deletions }}');
            const topdirs   = '${{ steps.gather.outputs.topdirs }}';
            const reviewers = '${{ steps.gather.outputs.reviewers }}';

            let page=1, per_page=100, allFiles=[];
            while(true){
              const res = await github.rest.pulls.listFiles({ owner, repo, pull_number: pr.number, page, per_page });
              allFiles = allFiles.concat(res.data);
              if(res.data.length < per_page) break;
              page++;
            }
            const filenames = allFiles.map(f=>f.filename);

            const BIG_FILES = files > 25;
            const BIG_LINES = additions > 800;
            const TOUCH_CORE = filenames.some(fn =>
              fn.startsWith('src/') ||
              fn.startsWith('apps/') ||
              fn.startsWith('db/migration') ||
              fn.includes('Dockerfile') ||
              fn.startsWith('.github/workflows')
            );
            const HAS_LABEL = (pr.labels || []).some(l =>
              ['needs-review','risk:high','breaking'].includes(l.name)
            );
            const isLarge = BIG_FILES || BIG_LINES || TOUCH_CORE || HAS_LABEL;

            let severity='LOW', score=0;
            if (BIG_FILES) score+=2;
            if (BIG_LINES) score+=2;
            if (TOUCH_CORE) score+=2;
            if (HAS_LABEL) score+=1;
            if (score >= 5) severity='HIGH';
            else if (score >= 3) severity='MEDIUM';

            const DB_SQL = filenames.some(fn => fn.toLowerCase().endsWith('.sql'));
            const DB_ENT = filenames.some(fn => fn.startsWith('src/entities/'));
            const dbChanged = DB_SQL || DB_ENT;

            const reasons = [
              BIG_FILES ? `변경 파일 ${files}건` : null,
              BIG_LINES ? `추가 라인 ${additions} (삭제 ${deletions})` : null,
              TOUCH_CORE ? `핵심 디렉토리 영향(src/, apps/, db/migration, Dockerfile, workflows)` : null,
              HAS_LABEL ? `라벨(needs-review/risk:high/breaking)` : null,
              dbChanged ? `DB 변경 의심(sql 또는 src/entities/*)` : null,
            ].filter(Boolean).join(', ');

            // Slack Blocks 구성 - PR 상세 정보
            const headerText = `*#${pr.number}* ${pr.title}\n*${base}* ← *${head}* by \`${pr.user.login}\`\n<${pr.html_url}|PR 링크>`;

            const fields = [
              { type: 'mrkdwn', text: `*변경 파일*\n${files}` },
              { type: 'mrkdwn', text: `*추가/삭제*\n+${additions} / -${deletions}` },
              { type: 'mrkdwn', text: `*Top 디렉토리*\n${topdirs}` },
              { type: 'mrkdwn', text: `*요청 리뷰어(정보)*\n${reviewers}` },
            ];
            if (dbChanged) {
              fields.push({ type: 'mrkdwn', text: `*DB 변경 감지*\n:warning: \`sql\`, \`src/entities/\`` });
            }

            const initialBlocks = [
              { type: 'section', text: { type: 'mrkdwn', text: headerText } },
              { type: 'context', elements: [{ type: 'mrkdwn', text: `범위판단: *${severity}* •  사유: ${reasons || 'n/a'}` }] },
              { type: 'section', fields }
            ];

            core.setOutput('blocks', JSON.stringify(initialBlocks)); # 기존 PR 정보 블록만 출력
            core.setOutput('isLarge', String(isLarge));
            core.setOutput('severity', severity);
            core.setOutput('reasons', reasons || 'n/a');
            core.setOutput('dbChanged', String(dbChanged));

      - name: Prepare mentions (3 specific Slack users)
        id: mentions
        shell: bash
        run: |
          MENTIONS="${{ secrets.CODE_OWNERS }}"
          echo "mentions=${MENTIONS}" >> $GITHUB_OUTPUT

  # Job 이름과 내용 변경
  notify-slack-detailed:
    name: Notify Slack (Detailed + CodeRabbit)
    runs-on: ubuntu-latest
    needs: [analyze, send-coderabbit-summary] # analyze와 send-coderabbit-summary 모두 완료되어야 함
    if: always()
    steps:
      - name: Combine Blocks and Post to Slack
        id: post_slack
        uses: actions/github-script@v7
        with:
          script: |
            // analyze Job에서 생성된 기본 PR 정보 블록들을 가져옵니다.
            const prBlocks = JSON.parse(`${{ needs.analyze.outputs.blocks }}`);
            // send-coderabbit-summary Job에서 가져온 CodeRabbit 요약 내용을 가져옵니다.
            const codeRabbitSummary = `${{ needs.send-coderabbit-summary.outputs.summary }}`;
            const mentions = `${{ needs.analyze.outputs.mentions }}`;

            let finalBlocks = [...prBlocks];

            // CodeRabbit 요약이 있을 경우에만 블록을 추가합니다.
            if (codeRabbitSummary && codeRabbitSummary.length > 0) {
              finalBlocks.push({ "type": "divider" });
              finalBlocks.push({
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🤖 CodeRabbit AI 요약",
                  "emoji": true
                }
              });
              finalBlocks.push({
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": codeRabbitSummary || '요약을 가져오는 데 실패했거나, 요약이 없습니다.'
                }
              });
            } else {
              console.log("CodeRabbit summary was not found or was empty.");
            }

            // 추가 정보 (범위 분석, Top 디렉토리)를 컨텍스트 블록으로 추가
            finalBlocks.push({ "type": "divider" });
            finalBlocks.push({
              "type": "context",
              "elements": [
                {
                  "type": "mrkdwn",
                  "text": "🔬 *범위 분석:* *`${{ needs.analyze.outputs.severity }}`* | *변경 파일:* `${{ needs.analyze.outputs.files }}`개 | *DB 변경:* `${{ needs.analyze.outputs.dbChanged == 'true' ? '⚠️ 있음' : '없음' }}`"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Top 디렉토리:* ${{ needs.analyze.outputs.topdirs }}"
                }
              ]
            });

            // Slack API 호출
            await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'slack-notification.yml', // 실제 Slack 전송 워크플로우 ID (혹은 직접 호출)
                ref: context.ref,
                inputs: {
                    channel_id: '${{ secrets.SLACK_CHANNEL_ID }}',
                    mentions: mentions,
                    blocks_json: JSON.stringify(finalBlocks)
                }
            });
            // 👆 위 부분은 만약 Slack 전송을 별도 워크플로우로 뺀 경우의 예시입니다.
            // 👇 기존 slackapi/slack-github-action 액션을 사용하여 직접 전송하는 경우

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'slack_notification',
              client_payload: {
                channel_id: '${{ secrets.SLACK_CHANNEL_ID }}',
                text_fallback: `PR #${context.issue.number} - ${context.payload.pull_request.title} (${needs.analyze.outputs.severity})`,
                blocks_json: JSON.stringify(finalBlocks),
                mentions: mentions
              }
            });
            // 👆 위 부분은 'repository_dispatch' 이벤트 사용 예시입니다.
            // 👇 slackapi/slack-github-action 액션을 직접 사용하는 최종 버전

            const slackPayload = {
              channel: '${{ secrets.SLACK_CHANNEL_ID }}',
              text: `PR #${context.issue.number} - ${context.payload.pull_request.title} (${needs.analyze.outputs.severity}) ${mentions}`,
              blocks: finalBlocks
            };

            // slackapi/slack-github-action@v1.25.0 액션을 호출합니다.
            // 이 스텝은 github-script 액션 내에서 직접 slack-github-action을 호출할 수는 없으므로
            // 이 JSON을 다음 스텝으로 전달하는 방식으로 구현해야 합니다.
            // 일단은 github-script에서 finalBlocks를 output으로 내보내고 다음 스텝에서 그 output을 사용하도록 합니다.
            core.setOutput('slack_blocks_output', JSON.stringify(finalBlocks));
            core.setOutput('slack_text_output', `PR #${context.issue.number} - ${context.payload.pull_request.title} (${needs.analyze.outputs.severity}) ${mentions}`);

      - name: Post to Slack with Combined Blocks
        uses: slackapi/slack-github-action@v1.25.0 # v1.25.0 버전 사용 권장
        with:
          channel-id: "${{ secrets.SLACK_CHANNEL_ID }}"
          bot-token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            {
              "text": "${{ steps.post_slack.outputs.slack_text_output }}",
              "blocks": ${{ steps.post_slack.outputs.slack_blocks_output }}
            }

  comment-and-label:
    name: Comment on PR (HIGH) + Auto label
    runs-on: ubuntu-latest
    needs: [analyze]
    permissions:
      pull-requests: write
      issues: write
    if: always()
    steps:
      - name: Ensure label "needs-review" exists on PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const targetLabel = 'needs-review';

            const existing = pr.labels?.map(l => l.name) || [];
            if (!existing.includes(targetLabel)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [targetLabel]
              });
              core.info(`Label "${targetLabel}" added.`);
            } else {
              core.info(`Label "${targetLabel}" already present.`);
            }

      - name: Comment on PR (dedup with marker)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const MARKER = '';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            if (comments.some(c => (c.body || '').includes(MARKER))) {
              core.info('Existing large PR comment found. Skipping duplicate.');
              return;
            }

            const files   = '${{ needs.analyze.outputs.files }}';
            const adds    = '${{ needs.analyze.outputs.additions }}';
            const dels    = '${{ needs.analyze.outputs.deletions }}';
            const reasons = `${{ needs.analyze.outputs.reasons }}`;
            const dbChanged = '${{ needs.analyze.outputs.dbChanged }}' === 'true';

            const dbLine = dbChanged
              ? '\n> ⚠️ `sql` 또는 `src/entities/` 변경 감지: **데이터베이스 변경점**이 있을 수 있어요.\n'
              : '';

            const body = `
            ${MARKER}

            ### 📌 PR 변경 사항 검토 안내
            - PR: #${pr.number} — **${pr.title}**
            - 범위 판단: **HIGH**
            - 사유: ${reasons}

            **변경 요약**
            - 변경 파일: ${files}개
            - 라인 변화: +${adds} / -${dels}
            - 링크: ${pr.html_url}
            ${dbLine}
            **리뷰 체크리스트 (가이드)**
            - [ ] 핵심 비즈니스 로직 및 기능 변경 사항 검토
            - [ ] DB/마이그레이션 영향 점검 (롤백 가능성 포함)
            - [ ] 신규 의존성, 라이브러리, 환경 설정 변경 확인
            - [ ] 예외 처리, 성능, 보안, 로그 레벨 점검
            - [ ] 문서/README/워크플로우 변경 사항 확인
            - [ ] 불필요한 파일/설정 변경, 대용량 diff 검토

            👉 **이 코멘트에 이모지(예: 👀, ✅)를 달아주시면 우선순위로 리뷰를 시작합니다.**
            `;

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body
            });

  send-coderabbit-summary:
    name: "Wait for CodeRabbit and Find Summary"
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()
    outputs:
      summary: ${{ steps.find_comment.outputs.summary }} # Slack으로 보낼 요약 내용을 출력

    steps:
      - name: "Wait for CodeRabbit review"
        run: sleep 120

      - name: "Find CodeRabbit summary comment"
        id: find_comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { owner, repo } = context.repo;
            const botUser = 'coderabbitai[bot]';
            const summaryIdentifier = 'Summary by CodeRabbit'; 

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });

            const codeRabbitComment = comments.find(comment =>
              comment.user.login === botUser && comment.body.includes(summaryIdentifier)
            );

            if (codeRabbitComment) {
              console.log('CodeRabbit summary comment found!');
              core.setOutput('summary', codeRabbitComment.body);
            } else {
              console.log('CodeRabbit summary comment not found after waiting.');
              core.setOutput('summary', '');
            }
