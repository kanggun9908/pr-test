- name: Comment on PR
  uses: actions/github-script@v7
  with:
    script: |
      const MARKER = '<!-- large-pr-comment -->';
      const pr = context.payload.pull_request;
      const dbLine = '';
      const body = `${MARKER}

### 📌 파일이 큽니다. 코드리뷰 하실?
- PR: #${pr.number} — **${pr.title}**
- 범위 판단: **HIGH**
- 사유: 테스트용

**변경 요약**
- 변경 파일: 30개
- 라인 변화: +1000 / -50
- 링크: ${pr.html_url}
${dbLine}
**리뷰 체크리스트**
- [ ] 핵심 경로/마이그레이션 확인
- [ ] 대용량 diff 검토
- [ ] 주요 사이드이펙트 점검
- [ ] 코딩 컨벤션/테스트/로그 점검

👉 **이 코멘트에 이모지 달아주시면 리뷰 우선 시작합니다.**
`;

      await github.rest.issues.createComment({
        owner: pr.base.repo.owner.login,
        repo: pr.base.repo.name,
        issue_number: pr.number,
        body
      });
