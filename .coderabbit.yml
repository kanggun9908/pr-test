# .coderabbit.yaml
# CodeRabbit 전체 설정 예시

reviews:
  # true로 설정하면 Pull Request가 준비 상태(ready for review)일 때 자동으로 리뷰를 실행합니다.
  # (기본값은 true이므로 보통 생략 가능합니다.)
  auto_review: true

  # 리뷰를 실행할 브랜치를 지정합니다.
  # "*"는 '모든 브랜치'를 의미합니다.
  # 특정 브랜치만 지정하려면 ["main", "develop"]와 같이 목록을 만들 수 있습니다.
  branches:
    - "*"

  # "Review skipped" 같은 상태 메시지를 표시할지 여부를 결정합니다.
  # false로 설정하면 해당 메시지가 더 이상 나타나지 않습니다.
  review_status: false
# 필요에 따라 아래에 다른 설정을 추가할 수 있습니다.
# 예를 들어, 특정 파일 경로나 타입을 리뷰에서 제외하는 설정 등이 있습니다.
# 더 자세한 내용은 CodeRabbit 공식 문서를 참고하세요.
